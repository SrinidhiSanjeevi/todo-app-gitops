# API version for core Kubernetes group
apiVersion: v1

# Kind specifies a Secret object used to store sensitive data securely
kind: Secret

# Metadata identifying secret object
metadata:
  # Secret name referenced by workloads
  name: todo-app-secret
  # Target namespace
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: security

# Secret type specifying opaque data structure
type: Opaque

# Base64-encoded sensitive key-value pairs
data:
  # Base64 encoded placeholder API Key ("devops-secret-key-12345")
  API_SECRET_KEY: "ZGV2b3BzLXNlY3JldC1rZXktMTIzNDU="
