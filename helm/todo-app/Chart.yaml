# Helm Chart API Version 2 for Helm 3+
apiVersion: v2

# Name of the Helm chart
name: todo-app

# Detailed description of chart function
description: Production-ready Helm chart for MERN Todo DevOps Application on AKS

# Chart type (application or library)
type: application

# Semantic version of chart package
version: 1.0.0

# Version of application contained within chart
appVersion: "1.0.0"

# Maintainers information
maintainers:
  - name: DevOps Team
    email: devops@example.com
