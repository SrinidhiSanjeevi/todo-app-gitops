# API Version for core Service resource
apiVersion: v1

# Kind specifies Service load balancing resource
kind: Service

# Metadata configuration template
metadata:
  name: backend-service
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "{{ .Values.backend.service.port }}"

# Spec section configuring ports and pod selector
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "todo-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
    - name: metrics
      port: {{ .Values.backend.service.metricsPort }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
